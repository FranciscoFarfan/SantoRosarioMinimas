<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santo Rosario</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="app-container">
        <!-- VISTA MENÚ PRINCIPAL -->
        <div id="menu-view" class="card active">
            <h1 class="app-title">Santo Rosario</h1>
            
            <div class="image-container">
                <img src="assets/Fatima.jpg" alt="Virgen de Fátima" class="menu-image">
            </div>
            
            <div class="divider"></div>
            
            <button id="btn-daily" class="btn btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 3h5v5h-5z"/></svg>
                Rosario del Día
            </button>
            
            <h2 class="section-title">Seleccionar Rosario:</h2>
            <div class="rosary-types-row">
                <button id="btn-gozosos" class="btn btn-type btn-gozosos">Gozosos</button>
                <button id="btn-dolorosos" class="btn btn-type btn-dolorosos">Dolorosos</button>
                <button id="btn-gloriosos" class="btn btn-type btn-gloriosos">Gloriosos</button>
            </div>
            
            <button id="btn-individual" class="btn btn-secondary">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                Rezar Misterio Individual
            </button>
            
            <div class="checkbox-container">
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-cantos">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-text">Incluir Cantos</span>
                </label>
            </div>
            
            <a href="https://franciscofarfan.github.io/FSSPX/Rosario/Rosario.html" target="_blank" class="info-link" title="Acerca de">
                <svg class="info-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </a>
        </div>
        
        <!-- VISTA DEL REPRODUCTOR -->
        <div id="player-view" class="card">
            <div class="player-header-row">
                <button id="btn-back" class="btn-icon-only" title="Volver al menú">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <div class="player-header-title">Santo Rosario</div>
                <div style="width: 40px;"></div> <!-- Spacer to center the title -->
            </div>
            
            <div class="player-content">
                <div class="album-art-container">
                    <img id="album-art" src="assets/Caratulas/Inicio.jpg" alt="Carátula" class="album-art">
                </div>
                
                <div id="track-header" class="track-header">Oraciones Iniciales</div>
                <div id="track-title" class="track-title">Inicio del Rosario</div>
                
                <div class="reflection-container">
                    <p id="reflection-text" class="reflection-text">Preparemos nuestro corazón para rezar el Santo Rosario con devoción.</p>
                </div>
                
                <!-- Roadmap de Progreso -->
                <div class="roadmap">
                    <div class="roadmap-item" data-tag="inicio">Inicio</div>
                    <div class="roadmap-arrow">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </div>
                    <div class="roadmap-item" data-tag="presentacion">Presentación</div>
                    <div class="roadmap-arrow">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </div>
                    <div class="roadmap-item" data-tag="misterio">Misterio</div>
                    <div class="roadmap-arrow">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </div>
                    <div class="roadmap-item" data-tag="canto">Canto</div>
                    <div class="roadmap-arrow">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </div>
                    <div class="roadmap-item" data-tag="final">Final</div>
                </div>
                
                <!-- Slider de Posición -->
                <div class="slider-container">
                    <input type="range" id="position-slider" min="0" max="100" value="0" class="position-slider">
                </div>
                
                <!-- Tiempo y Velocidad -->
                <div class="time-speed-row">
                    <div id="time-text" class="time-text">0:00 / 0:00</div>
                    <div class="speed-control">
                        <label for="speed-select" class="speed-label">Velocidad:</label>
                        <select id="speed-select" class="speed-select">
                            <option value="0.85">0.85x</option>
                            <option value="0.90">0.90x</option>
                            <option value="0.95">0.95x</option>
                            <option value="1.0" selected>1.0x</option>
                            <option value="1.1">1.1x</option>
                            <option value="1.2">1.2x</option>
                            <option value="1.3">1.3x</option>
                            <option value="1.4">1.4x</option>
                            <option value="1.5">1.5x</option>
                        </select>
                    </div>
                </div>
                
                <!-- Botones de Control de Pistas -->
                <div class="playback-controls">
                    <button id="btn-prev" class="btn-icon-only large" title="Anterior">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button id="btn-play-pause" class="btn-icon-only play-pause" title="Reproducir">
                        <!-- Play Icon -->
                        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Pause Icon (hidden initially) -->
                        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="btn-next" class="btn-icon-only large" title="Siguiente">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
